note: >-
  Derived from the status codes documented on the ShopMy Partners API reference
  pages. ShopMy returns a plain JSON envelope with an `error` string on failure
  (not RFC 9457 problem+json). Example error body:
  {"error": "Missing required scopes: The user has not authorized you to perform this action."}
