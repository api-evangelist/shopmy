  - status: 401
    title: Unauthorized
    meaning: >-
      Missing/invalid authentication, or the user has not granted the required
      scope. Example - "Missing required scopes: The user has not authorized you
      to perform this action." Also returned by Fetch Order Report when
      requesting an inaccessible source.
    source_operations:
      - openapi/shopmy-partners-openapi.yml#fetchOrderReport
