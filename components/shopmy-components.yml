pointer_decision:
  components_pointer_emitted: false
  rationale: >-
    No `type: Components` pointer is wired into apis.yml. That type denotes an
    embeddable UI component library a developer renders; ShopMy publishes none.
    The artifact is wired as `type: Integrations` instead, which is what this
    surface actually is.
