aid: shopmy
name: ShopMy
description: >-
  ShopMy is a creator-commerce and influencer-marketing platform connecting top
  brands with content creators across beauty, fashion, and lifestyle. Creators
  build curated digital shops and earn performance commissions (typically
  10-30%) plus paid brand partnerships, while brands run affiliate programs,
  product gifting (Lookbooks), and performance budgets (Opportunities). The
  ShopMy Partners API lets Brand Partners pull detailed affiliate order reports,
  and lets OAuth developer applications create and read product links, manage
  shelf collections, resolve and rate product URLs, search the catalog, and read
  public profile information on behalf of authenticated ShopMy users. Backed by
  Bain Capital Ventures, Bessemer Venture Partners, and Menlo Ventures.
