- aid: shopmy:shopmy-tracking-api
  name: ShopMy Tracking API
  description: >-
    Server-to-server affiliate tracking routes a brand calls to report completed
    orders to ShopMy for creator commission attribution, and to keep those
    commissions accurate through returns, edits and cancellations. Order
    Confirmation is unauthenticated and resolves the brand from the page URL
    domain; Order Update and Order Cancellation take the brand developer key as
    a bearer token. Every request is answered with an outcome code recorded on
    the brand's Tracking Health page, and most outcomes return HTTP 200 even
    when no commission could be attributed. Documented on docs.shopmy.us
    without an OpenAPI definition.
  humanURL: https://docs.shopmy.us/reference/tracking-routes-overview
  baseURL: https://api.shopmy.us/api
  tags:
  - Tracking
  - Affiliates
  - Order Attribution
  tags_raw:
